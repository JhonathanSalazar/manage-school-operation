<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Password Reset</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #1565C0;">Password Reset Request</h2>
  <p>You requested a password reset for your School Management account.</p>
  <p>Click the button below to reset your password. This link expires in <strong>1 hour</strong>.</p>
  <a href="{{resetLink}}"
     style="display: inline-block; padding: 12px 24px; background-color: #1565C0; color: white; text-decoration: none; border-radius: 4px; margin: 16px 0;">
    Reset Password
  </a>
  <p style="color: #666; font-size: 12px;">If you did not request this, you can safely ignore this email.</p>
</body>
</html>
